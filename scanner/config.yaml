scoring:
  weights:
    valuation: 0.40
    technical: 0.30
    options_liquidity: 0.20
    iv_setup: 0.10
  target_pe_discount: 0.15
  target_margin_of_safety: 0.20
  max_margin_of_safety: 0.50
  ideal_iv_rank_for_entry: 25

universe:
  default: sp500
  custom_watchlist: []
  sp500_plate_keywords:
    - "S&P 500"
    - "标普500"
    - "Standard & Poor"
  max_universe_size: 500
  fallback_top_market_cap: 200

valuation:
  valuation_interval_type: 4  # Year3 (Qot_Common.ValuationIntervalType)
  relative_weight: 0.20
  morningstar_weight: 0.15
  intrinsic_weight: 0.20
  analyst_weight: 0.12
  growth_context_weight: 0.08
  extended_multiples_weight: 0.05
  earnings_risk_weight: 0.05
  fundamental_weight: 0.15
  pe_ps_historical_discount: 0.15
  pe_ps_industry_discount: 0.15
  margin_of_safety: 0.20
  min_market_cap: 2000000000
  min_dividend_yield: 0.01

  analyst_score:
    stale_days: 180
    conflict_spread_pct: 0.25

  quality_multiplier:
    enabled: true
    min_factor: 0.70
    max_factor: 1.15

  growth_context:
    enabled: true

  financials:
    enabled: true
    statement_pages: 1
    reports_per_statement: 8

  extended_multiples:
    enabled: true
    target_ev_ebitda: 15.0

  fundamental:
    enabled: true
    fcf_yield_target: 0.05          # FCF/EV >= 5% scores full marks
    roic_target: 0.12               # ROIC (or ROE fallback) >= 12% is healthy
    net_debt_ebitda_warn: 3.0       # >3x net debt/EBITDA = warning
    net_debt_ebitda_distress: 4.0   # >4x = distress, caps the pillar score
    fcf_yield_weight: 0.35
    returns_weight: 0.25
    leverage_weight: 0.20
    trend_weight: 0.20

  earnings_reaction:
    enabled: true
    max_events: 8

  dcf:
    high_growth_years: 3
    transition_years: 2
    high_growth_rate: 0.12
    transition_growth_rate: 0.06
    terminal_growth_rate: 0.025
    capex_pct_of_ocf: 0.15
    risk_free_rate: 0.045
    market_return: 0.10
    tax_rate: 0.21
    cost_of_debt: 0.05
    max_intrinsic_price_multiple: 3.0
  ddm:
    dividend_growth_rate: 0.05

analyst_ratings:
  enabled: true
  page_size: 20
  max_pages: 3
  max_analysts: 10
  sort_by: stock_success_rate  # stock_success_rate | stars
  require_target_price: true   # drop analysts without a usable latest target price
  require_success_rate: true   # drop analysts with empty/zero success rate

options:
  min_open_interest: 1000
  max_atm_bid_ask_pct: 0.05
  iv_rank_high: 60
  iv_rank_low: 30
  front_expirations: 2

technical:
  ema_fast: 50
  ema_slow: 200
  rsi_period: 14
  rsi_oversold: 30
  kline_bars: 250
  volume:
    enabled: true
    rvol_lookback: 20
    adv_lookback: 20
    accumulation_lookback: 20
    recovery_days: 3
    min_adv_usd: 5000000
    rvol_confirm_threshold: 1.2
    rvol_strong_threshold: 1.5
    rvol_weak_threshold: 0.5
    accumulation_min_ratio: 1.1

iv_cache:
  db_path: "~/.moomoo_scanner/iv_history.db"
  min_snapshots: 20
  snapshot_interval_hours: 24
  lookback_days: 365

api:
  request_delay_sec: 1.0
  max_retries: 3
  retry_backoff_sec: 2.0
  batch_size_snapshot: 100
  timeout_sec: 30

output:
  json_path: "scanner_output.json"
  csv_path: "scanner_output.csv"
  # Curated "decision view" for the CSV. JSON always keeps the full detail.
  # Comment out the whole list to fall back to exporting every column.
  csv_columns:
    # Identity
    - code
    - name
    - price
    - market_cap
    # Ranking / scores
    - entry_score
    - valuation_score
    - technical_score
    - options_score
    - fundamental_score
    - relative_score
    - ms_score
    - analyst_score
    # Valuation snapshot
    - pe_ttm
    - pe_percentile
    - ev_ebitda
    - peg_ratio
    - pegy_ratio
    - best_margin_of_safety
    - price_to_fair_value
    # Fundamental health / value-trap guardrails
    - fcf_yield
    - roic
    - net_debt_to_ebitda
    - leverage_flag
    - growth_value_trap_flag
    - fcf_trend
    - revenue_trend
    - margin_trend
    # Morningstar
    - ms_fair_value
    - ms_star_rating
    # Analyst consensus
    - analyst_target_avg
    - analyst_ratings_count
    - analyst_pct_above_price
    # Analyst aggregates - most recently updated (count follows max_analysts)
    - recent_n
    - recent_tgt_min
    - recent_tgt_max
    - recent_tgt_avg
    - recent_sr_min
    - recent_sr_max
    - recent_sr_avg
    - recent_date_min
    - recent_date_max
    - recent_date_median
    # Analyst aggregates - highest success rate (count follows max_analysts)
    - topsr_n
    - topsr_tgt_min
    - topsr_tgt_max
    - topsr_tgt_avg
    - topsr_sr_min
    - topsr_sr_max
    - topsr_sr_avg
    - topsr_date_min
    - topsr_date_max
    - topsr_date_median
    # Technical + volume
    - ema_fast
    - ema_slow
    - rsi
    - rvol
    - bullish_turnaround
    - volume_recovery_confirmed
    - adv_usd
    # Options / IV
    - iv_rank
    - iv_environment
    # Action
    - recommended_strategies
    - strategy_rationale

logging:
  level: INFO
  json_format: false

mock:
  enabled: false
  fixture_path: "scanner/data/mock_universe.json"
